name: Build macOS DMG Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Generate icon & build macOS .app + .dmg (arm64 + x64)
        run: |
          npm run gen-icon
          npx electron-builder --mac dir --arm64 --x64
          mkdir -p dist/dmg-arm64 dist/dmg-x64
          cp -R "dist/mac-arm64/Antigravity Auto-Hub.app" dist/dmg-arm64/
          ln -s /Applications dist/dmg-arm64/Applications
          hdiutil create -volname "Antigravity Auto-Hub" -srcfolder dist/dmg-arm64 -ov -format UDZO "dist/Antigravity-Auto-Hub-2.2.0-macOS-arm64.dmg"
          cp -R "dist/mac/Antigravity Auto-Hub.app" dist/dmg-x64/
          ln -s /Applications dist/dmg-x64/Applications
          hdiutil create -volname "Antigravity Auto-Hub" -srcfolder dist/dmg-x64 -ov -format UDZO "dist/Antigravity-Auto-Hub-2.2.0-macOS-x64.dmg"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List built DMG artifacts
        run: ls -lh dist/*.dmg

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Auto-Hub-macOS-DMG
          path: macos/dist/*.dmg
          retention-days: 30

      - name: Create or update GitHub Release (v2.2.0-macos)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0-macos
          name: Antigravity Auto-Hub v2.2.0 (macOS DMG)
          body: |
            Bộ cài đặt chính thức **Antigravity Auto-Hub v2.2.0 cho macOS**:
            - `arm64.dmg`: dành cho Mac chip **Apple Silicon (M1 / M2 / M3 / M4)**
            - `x64.dmg`: dành cho Mac chip **Intel**

            **Cập nhật mới trong v2.2.0:**
            - Tự động xoay vòng `rotator.log` khi vượt 1 MB (giữ 2.000 dòng mới nhất).
            - Xếp hạng tài khoản đích thông minh: ưu tiên **Quota khả dụng cao nhất -> Quota Tuần cao nhất -> Gói Ultra > Pro > Free**.
            - Hiển thị thời gian quét `(X.Xs)` trực tiếp cạnh giờ cập nhật.
            - Hỗ trợ đầy đủ Antigravity IDE `2.34+` / `2.35+`, gói **Free / Pro / Ultra**, Keychain, Menu Bar và macOS Notification.
          files: macos/dist/*.dmg
          draft: false
          prerelease: false
